<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANSARI DISCOUNT MART</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-md mx-auto p-3 flex justify-between items-center">
            <div class="flex items-center gap-2" onclick="showPage('home')" style="cursor: pointer;">
                <div class="bg-emerald-700 text-white font-bold p-2 rounded-lg text-sm">ADM</div>
                <div>
                    <h1 class="font-extrabold text-sm leading-tight">ANSARI</h1>
                    <p class="text-[10px] text-amber-600 font-bold tracking-wider">DISCOUNT MART</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="showAdminModal()" class="text-xs text-gray-600 flex items-center gap-1 font-semibold">
                    <i data-lucide="truck" class="w-4 h-4"></i> Admin
                </button>
                <button onclick="showPage('cart')" class="relative">
                    <i data-lucide="shopping-bag" class="w-6 h-6 text-emerald-700"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-amber-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
        <div class="max-w-md mx-auto px-3 pb-3">
            <input type="text" placeholder="Search products in Bernala..." class="w-full bg-gray-50 border rounded-lg py-1.5 px-3 text-xs focus:outline-none focus:ring-1 focus:ring-emerald-600">
        </div>
    </header>

    <!-- App Content -->
    <main id="app-content" class="flex-1 max-w-md w-full mx-auto p-3">
        <!-- Dynamic Content Load Here -->
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white mt-auto">
        <div class="max-w-md mx-auto p-4 space-y-4">
            <div>
                <h2 class="font-bold text-sm text-emerald-400">ANSARI DISCOUNT MART</h2>
                <p class="text-[11px] text-gray-400 mt-1">Your trusted local supermarket for daily groceries, household goods, plasticware, and everyday essentials at wholesale discounted rates.</p>
            </div>
            <div class="text-xs space-y-1">
                <p class="font-bold text-gray-300">Store Location</p>
                <p class="text-gray-400 text-[11px]">Main Bazaar Bernala</p>
            </div>
        </div>
    </footer>

    <!-- Script Logic -->
    <script>
        const products = [
            { id: 1, name: "Shan Biryani Masala 50g", price: 120, category: "Grocery", image: "https://via.placeholder.com/150" },
            { id: 2, name: "Tapal Danedar Tea 400g", price: 550, category: "Grocery", image: "https://via.placeholder.com/150" },
            { id: 3, name: "Olper's Milk 1 Litre", price: 290, category: "Dairy", image: "https://via.placeholder.com/150" },
            { id: 4, name: "Surf Excel 1kg Pack", price: 680, category: "Household", image: "https://via.placeholder.com/150" }
        ];

        let cart = [];
        let orders = JSON.parse(localStorage.getItem('adm_orders')) || [];

        function initApp() {
            showPage('home');
            updateCartCount();
        }

        function showPage(page) {
            const main = document.getElementById('app-content');
            if (page === 'home') main.innerHTML = getHomePageHTML();
            else if (page === 'cart') main.innerHTML = getCartPageHTML();
            else if (page === 'checkout') main.innerHTML = getCheckoutPageHTML();
            else if (page === 'track') main.innerHTML = getTrackPageHTML();
            else if (page === 'admin') main.innerHTML = getAdminPanelHTML();
            lucide.createIcons();
            window.scrollTo(0, 0);
        }

        function updateCartCount() {
            const count = cart.reduce((total, item) => total + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        }

        function addToCart(pId) {
            const item = cart.find(i => i.id === pId);
            if (item) item.qty++;
            else {
                const prod = products.find(p => p.id === pId);
                cart.push({ ...prod, qty: 1 });
            }
            updateCartCount();
        }

        function getHomePageHTML() {
            return `
                <div class="grid grid-cols-2 gap-3">
                    ${products.map(p => `
                        <div class="bg-white border rounded-xl p-2.5 flex flex-col justify-between shadow-sm">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-28 object-cover rounded-lg mb-2">
                            <div>
                                <h3 class="font-bold text-xs text-gray-800 line-clamp-2">${p.name}</h3>
                                <p class="text-emerald-700 font-extrabold text-xs mt-1">Rs. ${p.price}</p>
                            </div>
                            <button onclick="addToCart(${p.id})" class="mt-2 w-full bg-emerald-600 text-white text-xs py-1.5 rounded-lg font-bold">Add to Cart</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function getCartPageHTML() {
            if (cart.length === 0) {
                return `
                    <div class="text-center py-10">
                        <i data-lucide="shopping-cart" class="w-12 h-12 text-gray-300 mx-auto mb-2"></i>
                        <p class="text-xs text-gray-500 font-semibold">Your cart is empty.</p>
                        <button onclick="showPage('home')" class="mt-3 bg-emerald-600 text-white text-xs px-4 py-2 rounded-lg font-bold">Start Shopping</button>
                    </div>
                `;
            }

            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            return `
                <div class="bg-white border rounded-xl p-4 shadow-sm space-y-3">
                    <h2 class="font-bold text-sm text-gray-800 border-b pb-2">Your Cart Items</h2>
                    ${cart.map(item => `
                        <div class="flex justify-between items-center text-xs border-b pb-2">
                            <div>
                                <p class="font-bold text-gray-800">${item.name}</p>
                                <p class="text-gray-500">Rs. ${item.price} x${item.qty}</p>
                            </div>
                            <p class="font-bold text-emerald-700">Rs. ${item.price * item.qty}</p>
                        </div>
                    `).join('')}
                    <div class="flex justify-between text-xs font-bold pt-1">
                        <span>Subtotal:</span>
                        <span>Rs. ${subtotal}</span>
                    </div>
                    <button onclick="showPage('checkout')" class="w-full bg-amber-500 text-slate-900 font-extrabold text-xs py-2 rounded-lg">Proceed to Checkout</button>
                </div>
            `;
        }

        function getCheckoutPageHTML() {
            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const deliveryCharges = 300;
            const grandTotal = subtotal + deliveryCharges;

            return `
                <div class="bg-white p-4 rounded-xl border shadow-sm text-xs space-y-3">
                    <h2 class="font-bold text-sm border-b pb-2">Checkout Details</h2>
                    <form onsubmit="handleOrderSubmit(event)" class="space-y-3">
                        <div>
                            <label class="block font-bold mb-1">Full Name</label>
                            <input type="text" id="custName" required class="w-full border p-2 rounded-lg">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Phone Number</label>
                            <input type="tel" id="custPhone" required class="w-full border p-2 rounded-lg">
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Delivery Address</label>
                            <textarea id="custAddress" required class="w-full border p-2 rounded-lg" rows="2"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Courier Partner</label>
                            <select id="custCourier" class="w-full border p-2 rounded-lg">
                                <option value="Leopard Courier">Leopard Courier</option>
                                <option value="TCS Express">TCS Express</option>
                                <option value="PostEx">PostEx</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-bold mb-1">Payment Method</label>
                            <select id="custPayment" onchange="togglePaymentDetails()" class="w-full border p-2 rounded-lg">
                                <option value="Cash on Delivery">Cash on Delivery (COD)</option>
                                <option value="JazzCash / EasyPaisa">JazzCash / EasyPaisa (Online Payment)</option>
                            </select>
                        </div>

                        <div id="onlinePaymentBox" class="hidden bg-emerald-50 border border-emerald-200 p-3 rounded-lg space-y-1">
                            <p class="font-bold text-emerald-900">Payment Account Details:</p>
                            <p><b>Account Title:</b> <span class="text-emerald-800 font-semibold">Ansari Discount Mart</span></p>
                            <p><b>JazzCash IBAN:</b> <span class="font-mono text-emerald-800">0300-1234567</span></p>
                            <p><b>EasyPaisa IBAN:</b> <span class="font-mono text-emerald-800">0311-7654321</span></p>
                            <div class="pt-2 border-t border-emerald-200">
                                <label class="block font-bold mb-1 text-gray-800">Transaction ID / TRX ID</label>
                                <input type="text" id="custTrxId" placeholder="Enter 11-digit TRX ID" class="w-full border p-2 rounded-lg text-xs">
                            </div>
                        </div>

                        <div class="border-t pt-2 space-y-1">
                            <div class="flex justify-between"><span>Items Subtotal:</span><span>Rs. ${subtotal}</span></div>
                            <div class="flex justify-between"><span>Delivery Charges (500g Shipment):</span><span>Rs. ${deliveryCharges}</span></div>
                            <div class="flex justify-between font-extrabold text-sm border-t pt-1"><span>Total Amount Payable:</span><span class="text-emerald-700">Rs. ${grandTotal}</span></div>
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold py-2 rounded-lg">Place Order</button>
                    </form>
                </div>
            `;
        }

        function togglePaymentDetails() {
            const method = document.getElementById('custPayment').value;
            const box = document.getElementById('onlinePaymentBox');
            const trxInput = document.getElementById('custTrxId');
            if (method === 'JazzCash / EasyPaisa') {
                box.classList.remove('hidden');
                trxInput.required = true;
            } else {
                box.classList.add('hidden');
                trxInput.required = false;
            }
        }

        function handleOrderSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const address = document.getElementById('custAddress').value;
            const courier = document.getElementById('custCourier').value;
            const payment = document.getElementById('custPayment').value;
            const trxId = document.getElementById('custTrxId') ? document.getElementById('custTrxId').value : '';

            const subtotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const deliveryCharges = 300;
            const grandTotal = subtotal + deliveryCharges;

            const orderId = "ADM-" + Math.floor(100000 + Math.random() * 900000);
            const newOrder = {
                id: orderId,
                name,
                phone,
                address,
                courier,
                payment: payment === 'JazzCash / EasyPaisa' ? `JazzCash/EasyPaisa (TRX: ${trxId})` : payment,
                trxId: trxId,
                items: [...cart],
                subtotal,
                deliveryCharges,
                total: grandTotal,
                status: payment === 'JazzCash / EasyPaisa' ? 'Payment Verification Pending' : 'Order Confirmed (COD)',
                date: new Date().toLocaleDateString()
            };

            orders.push(newOrder);
            localStorage.setItem('adm_orders', JSON.stringify(orders));

            cart = [];
            updateCartCount();

            const main = document.getElementById('app-content');
            main.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-6 rounded-xl border text-center shadow-sm">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="check-circle" class="w-8 h-8"></i>
                    </div>
                    <h3 class="font-extrabold text-lg text-gray-800">Order Placed Successfully!</h3>
                    <p class="text-xs text-gray-500 mt-1">Thank you, <b>${name}</b>. Your order has been placed.</p>
                    
                    <div class="bg-gray-50 border rounded-lg p-3 my-4 text-left text-xs space-y-1.5">
                        <p><b>Order ID:</b> <span class="text-emerald-700 font-bold">${orderId}</span></p>
                        <p><b>Courier Partner:</b> ${courier}</p>
                        <p><b>Payment Method:</b> ${payment}</p>
                        ${trxId ? `<p><b>TRX ID (Payment Confirmed):</b> <span class="font-bold text-emerald-800">${trxId}</span></p>` : ''}
                        <p><b>Total Amount Payable:</b> Rs. ${grandTotal} (Inc. Rs. 300 Shipping)</p>
                        <p><b>Delivery Address:</b> ${address}</p>
                    </div>

                    <p class="text-[11px] text-gray-400 mb-4">Save your Order ID to track delivery status.</p>
                    
                    <div class="flex gap-2">
                        <button onclick="showPage('home')" class="flex-1 bg-emerald-600 text-white font-bold py-2 rounded-lg text-xs">Continue Shopping</button>
                        <button onclick="showPage('track')" class="flex-1 border border-gray-300 font-bold py-2 rounded-lg text-xs text-gray-700">Track Order</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
            window.scrollTo(0,0);
        }

        function getTrackPageHTML() {
            return `
                <div class="max-w-md mx-auto bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="font-extrabold text-lg text-gray-800 mb-4 border-b pb-2">Track Your Order</h3>
                    <div class="space-y-3">
                        <input type="text" id="trackInput" placeholder="Enter Order ID (e.g. ADM-123456)" class="w-full border rounded-lg p-2 text-xs focus:ring-1 focus:ring-emerald-600 focus:outline-none">
                        <button onclick="searchOrder()" class="w-full bg-emerald-600 text-white font-bold py-2 rounded-lg text-xs">Search Order</button>
                    </div>
                    <div id="trackResult" class="mt-4"></div>
                </div>
            `;
        }

        function searchOrder() {
            const query = document.getElementById('trackInput').value.trim();
            const resDiv = document.getElementById('trackResult');
            const found = orders.find(o => o.id.toLowerCase() === query.toLowerCase());

            if (found) {
                resDiv.innerHTML = `
                    <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-3 text-xs space-y-1">
                        <p class="font-bold text-emerald-800 mb-1">Status: ${found.status}</p>
                        <p><b>Name:</b> ${found.name}</p>
                        <p><b>Courier:</b> ${found.courier}</p>
                        <p><b>Total:</b> Rs. ${found.total}</p>
                        ${found.trxId ? `<p><b>TRX ID:</b> ${found.trxId}</p>` : ''}
                        <p><b>Date:</b> ${found.date}</p>
                    </div>
                `;
            } else {
                resDiv.innerHTML = `<p class="text-xs text-red-500 text-center font-bold">No order found with ID "${query}"</p>`;
            }
        }

        function showAdminModal() {
            const pass = prompt("Enter Admin Password:");
            if (pass === "adm123" || pass === "1234") {
                showPage('admin');
            } else if (pass) {
                alert("Incorrect Password!");
            }
        }

        function getAdminPanelHTML() {
            return `
                <div class="bg-white p-6 rounded-xl border shadow-sm">
                    <h3 class="font-extrabold text-lg text-gray-800 mb-4 border-b pb-2">Admin Dashboard - Customer Orders</h3>
                    ${orders.length === 0 ? '<p class="text-xs text-gray-500">No orders placed yet.</p>' : `
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead>
                                    <tr class="bg-gray-100 border-b">
                                        <th class="p-2">Order ID</th>
                                        <th class="p-2">Customer</th>
                                        <th class="p-2">Phone</th>
                                        <th class="p-2">Courier</th>
                                        <th class="p-2">Total</th>
                                        <th class="p-2">Payment Details</th>
                                        <th class="p-2">Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${orders.map(o => `
                                        <tr class="border-b">
                                            <td class="p-2 font-bold">${o.id}</td>
                                            <td class="p-2">${o.name}</td>
                                            <td class="p-2">${o.phone}</td>
                                            <td class="p-2">${o.courier}</td>
                                            <td class="p-2 font-bold text-emerald-700">Rs. ${o.total}</td>
                                            <td class="p-2 font-mono">${o.payment}</td>
                                            <td class="p-2"><span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold">${o.status}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>                        </div>
                    `}
                </div>
            `;
        }

        window.onload = initApp;
    </script>
</body>
</html>
